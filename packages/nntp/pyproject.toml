[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nntp"
version = "0.0.1"
description = "Neural Network Training Pipeline"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
nntp = "nntp.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nntp*"]