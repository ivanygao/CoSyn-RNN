training:
  batch_mode: fixed
  batch_size: 256

models:
  RNNModel:
    # RNN specific
    dt: [20]
    tau: [100]
    hidden_size: [256]
    hidden_activation: [leakyrelu]
    output_activation: [linear]
    initial_weight_distribution: [uniform]
    initial_spectral_radius: [1]
    noise_std: [0.05]

    # training required parameters
    trainable_params:
      - W_in: true
        W_rec: true
        W_out: true
        b_h: true
        b_y: true

    loss: [mse]
    optimizer: [adam]
    learning_rate: [1e-4]

    # Task specific
    fixation_tolerance: [0.1]
    radius_tolerance: [0.2]
    angle_tolerance: [36] # out of 360 degrees
    fixation_threshold: [0.1]
    radius_threshold: [0.2]
    angle_threshold: [36] # out of 360 degrees
