name: "test"
note: ""
description: "this is a test"
seed: [1, 42]

logger:
  checkpoint_interval: 4
  wandb: test

dataset:
  training_size: 4096
  validation_size: 4096
  test_size: 4096

workflow:
  - name: "phase1"
    epochs: 16
    training_strategy: sequential
    training_tasks: [fdgo-ry]
    validation_tasks: [fdgo-ry, reactgo-ry, delaygo-ry]
    test_tasks: [fdgo-ry, reactgo-ry, delaygo-ry]
  - name: "phase2"
    epochs: 16
    training_strategy: sequential
    training_tasks: [reactgo-ry]
    validation_tasks: [fdgo-ry, reactgo-ry, delaygo-ry]
    test_tasks: [fdgo-ry, reactgo-ry, delaygo-ry]
  - name: "phase3"
    epochs: 16
    training_strategy: sequential
    training_tasks: [delaygo-ry]
    validation_tasks: [fdgo-ry, reactgo-ry, delaygo-ry]
    test_tasks: [fdgo-ry, reactgo-ry, delaygo-ry]
    
training:
  batch_mode: fixed
  batch_size: 256

models:
  CoSynRNNModel:
    # RNN specific
    dt: [20]
    tau: [100]
    hidden_size: [64]
    hidden_activation: [leakyrelu]
    excitation_activation: [relu]
    modulation_activation: [sigmoid20]
    output_activation: [linear]
    initial_weight_distribution: [uniform]
    initial_spectral_radius: [1]
    noise_std: [0.05]

    cue_index_start: [65]
    threshold: [1e-4]

    # training required parameters
    loss: [mse]
    optimizer: [adam]
    learning_rate: [1e-4]

    penalty_loss_coefficient: [4]
    
    excitation_sparsity_penalty: [0.1]
    recurrent_sparsity_penalty: [1]
    recurrent_incoming_penalty: [0.01]
    recurrent_outgoing_penalty: [0.01]
    modulated_readout_penalty: [0.1]

    # Task specific
    fixation_tolerance: [0.1]
    radius_tolerance: [0.2]
    angle_tolerance: [36] # out of 360 degrees, RY's theta
    fixation_threshold: [0.1]
    radius_threshold: [0.2]
    angle_threshold: [36] # out of 360 degrees, RY's theta